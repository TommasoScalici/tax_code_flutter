name: shared
description: "Shared code for Tax Code app."
version: 1.6.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Core & Utilities
  equatable: ^2.0.7
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.3
  json_annotation: ^4.9.0
  logger: ^2.8.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

  # State Management
  provider: ^6.1.5

  # Firebase & Backend
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  hive_ce_generator: ^1.9.0
  json_serializable: ^6.11.4
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
