name: shared
description: "Shared code for Tax Code app."
version: 1.7.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Core & Utilities
  equatable: ^2.0.7
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  json_annotation: ^4.9.0
  logger: ^2.8.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

  # State Management
  provider: ^6.1.5

  # Firebase & Backend
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  hive_ce_generator: ^1.9.0
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
