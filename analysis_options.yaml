include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.mocks.dart"
    - "**/*.g.dart"
    - build/**
    - android/**
    - .dart_tool/**

linter:
  rules:
    # Pragmatic overrides for productivity & styling conventions
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    sort_pub_dependencies: false # Dependencies are grouped by category and sorted manually within each group
    sort_constructors_first: false
    prefer_int_literals: false
    omit_local_variable_types: false
    always_put_required_named_parameters_first: false
    one_member_abstracts: false
    unnecessary_breaks: false
    cascade_invocations: false
    eol_at_end_of_file: false
    avoid_slow_async_io: false
    use_if_null_to_convert_nulls_to_bools: false
    prefer_final_in_for_each: false
    avoid_positional_boolean_parameters: false
    use_setters_to_change_properties: false

    # Enforced quality, safety and performance rules
    depend_on_referenced_packages: true
    use_colored_box: true
    avoid_redundant_argument_values: true
    always_use_package_imports: true
    avoid_void_async: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true
