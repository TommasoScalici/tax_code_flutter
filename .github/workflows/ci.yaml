name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter Quality & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies (Pub Workspaces)
        run: flutter pub get

      - name: 🎨 Verify Dart code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔤 Verify ARB file ordering
        run: dart run tool/arb_tool.dart check

      - name: 🔍 Validate ARB strict rules
        run: dart run tool/arb_tool.dart validate

      - name: 🛡️ Run Flutter static analysis
        run: flutter analyze --fatal-infos

      - name: 🧪 Run tests (shared)
        run: flutter test shared

      - name: 🧪 Run tests (mobile)
        run: flutter test mobile

      - name: 🧪 Run tests (wearable)
        run: flutter test wearable

  functions-checks:
    name: Firebase Functions Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🎨 Check Prettier formatting
        run: npm run format:check

      - name: 🏗️ Build TypeScript
        run: npm run build

      - name: 🧪 Run Vitest test suite
        run: npm test
