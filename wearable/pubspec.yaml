name: tax_code_flutter_wear_os
description: "App for Italian Tax Code calculation, made for Wear OS."
publish_to: "none"
version: 2.1.1+62

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Local module
  shared:

  # Core & Utilities
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  google_sign_in: ^6.3.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  logger: ^2.8.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # UI & Functionality
  barcode_widget: ^2.0.4

  # Firebase & Backend
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
