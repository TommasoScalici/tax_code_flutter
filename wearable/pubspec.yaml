name: tax_code_flutter_wear_os
description: "App for Italian Tax Code calculation, made for Wear OS."
publish_to: "none"
version: 2.0.0+51

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Local module
  shared:
    path: ../shared

  # Core & Utilities
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^6.3.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.3
  logger: ^2.8.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # UI & Functionality
  barcode_widget: ^2.0.4

  # Firebase & Backend
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
